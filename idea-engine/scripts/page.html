<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idea map</title>
<style>
:root{--bg:#fafaf9;--panel:#ffffff;--ink:#1c1c1a;--muted:#75736d;--line:#e6e4de;--idea:#c2410c;--focus:#1c1c1a}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--panel:#1a1a19;--ink:#ecebe7;--muted:#9a978f;--line:#2b2a27;--idea:#fb923c;--focus:#ecebe7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}
header{max-width:1280px;margin:0 auto;padding:28px 24px 12px}
h1{font-size:22px;line-height:1.3;font-weight:600;margin:0 0 6px;max-width:820px}
header p{margin:0;color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:8px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.plot{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);aspect-ratio:1/1;overflow:hidden}
svg{width:100%;height:100%;display:block}
.dot{cursor:pointer;transition:r .15s}
.dot:hover{r:7}
.glabel{font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;pointer-events:none}
.idea{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .1s}
aside{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:14px;margin:0 0 10px}
.spread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.spread li{cursor:pointer;padding:10px;border-radius:10px;border:1px solid var(--line)}
.spread li:hover,.spread li[aria-current=true]{border-color:var(--focus)}
.spread b{display:block;font-size:14px}
.spread small{color:var(--muted)}
.band{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:4px}
.b-copy{color:#b91c1c}.b-close{color:#a16207}.b-fresh{color:#15803d}.b-outlier{color:#7c3aed}.b-none{color:var(--muted)}
@media (prefers-color-scheme:dark){.b-copy{color:#f87171}.b-close{color:#facc15}.b-fresh{color:#4ade80}.b-outlier{color:#c4b5fd}}
#detail p{margin:6px 0}#detail .lbl{color:var(--muted);font-size:12px;display:block}
#near{margin-top:10px;font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}#near:hover{border-color:var(--focus)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{font-size:12px;color:var(--muted)}.stats b{display:block;font-size:18px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1 id="q"></h1>
  <p id="sub"></p>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="plot" id="plot"><svg id="svg" viewBox="0 0 1000 1000" role="img" aria-label="Map of every approach found, grouped by how alike they are"></svg><div class="tip" id="tip"></div></div>
  <aside>
    <div class="card"><h2>New ideas, from close to wild</h2><ul class="spread" id="spread"></ul></div>
    <div class="card" id="detail"><h2>Click any dot or idea</h2><p style="color:var(--muted)">Dots are things that already exist. Rings are new ideas made for the gaps.</p></div>
  </aside>
</main>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAL = ["#2563eb","#db2777","#059669","#d97706","#7c3aed","#0891b2","#dc2626","#65a30d","#c026d3","#0d9488","#ea580c","#4f46e5","#be123c","#16a34a"];
const col = g => g < 0 ? "var(--muted)" : PAL[g % PAL.length];
const RANK = {copy: 0, close: 1, fresh: 2, outlier: 3};
const bandClass = v => v in RANK ? "b-" + v : "b-none";
const X = x => 40 + x * 920, Y = y => 40 + (1 - y) * 920;

$("#q").textContent = D.q.question;
$("#sub").textContent = "Each dot is one " + (D.q.node || "thing") + " that already exists. Things that work alike sit close together.";
$("#stats").innerHTML = [
  [D.points.length, "found"], [D.groups.length, "families"], [D.ideas.length, "new ideas"]
].map(([b, t]) => "<div><b>" + b + "</b>" + t + "</div>").join("");

const svg = $("#svg"), tip = $("#tip");
const ns = "http://www.w3.org/2000/svg";
function el(t, a){ const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; }
D.points.forEach((p, i) => {
  const c = el("circle", {cx: X(p.x), cy: Y(p.y), r: 4.5, fill: col(p.g), "fill-opacity": p.g < 0 ? .45 : .8, class: "dot"});
  c.addEventListener("mouseenter", ev => tipShow(ev, p.n));
  c.addEventListener("mouseleave", () => tip.style.opacity = 0);
  c.addEventListener("click", () => showNode(p));
  svg.appendChild(c);
});
D.groups.forEach(g => { const t = el("text", {x: X(g.x), y: Y(g.y), "text-anchor": "middle", class: "glabel"}); t.textContent = g.name; svg.appendChild(t); });
D.ideas.forEach((d, i) => {
  const g = el("g", {class: "idea", transform: "translate(" + X(d.x) + "," + Y(d.y) + ")"});
  g.appendChild(el("circle", {r: 11, fill: "none", stroke: "var(--idea)", "stroke-width": 2.5}));
  const t = el("text", {y: 4, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: "var(--idea)"}); t.textContent = i + 1; g.appendChild(t);
  g.addEventListener("mouseenter", ev => tipShow(ev, d.name));
  g.addEventListener("mouseleave", () => tip.style.opacity = 0);
  g.addEventListener("click", () => showIdea(d, i));
  svg.appendChild(g);
});
function tipShow(ev, text){ const r = $("#plot").getBoundingClientRect(); tip.textContent = text; tip.style.left = (ev.clientX - r.left + 12) + "px"; tip.style.top = (ev.clientY - r.top + 12) + "px"; tip.style.opacity = 1; }

const order = D.ideas.map((d, i) => [d, i]).sort((a, b) => (RANK[a[0].verdict] ?? 9) - (RANK[b[0].verdict] ?? 9) || a[1] - b[1]);
$("#spread").innerHTML = order.map(([d, i]) =>
  '<li data-i="' + i + '"><span class="band ' + bandClass(d.verdict) + '">' + esc(d.verdict) + '</span><b>' + (i+1) + ". " + esc(d.name) + "</b><small>" + esc(d.what) + "</small></li>").join("") || "<li><small>No ideas yet.</small></li>";
document.querySelectorAll("#spread li[data-i]").forEach(li => li.onclick = () => showIdea(D.ideas[+li.dataset.i], +li.dataset.i));

function field(l, v){ return v ? '<p><span class="lbl">' + l + "</span>" + esc(v) + "</p>" : ""; }
function showNode(p){
  $("#detail").innerHTML = "<h2>" + esc(p.n) + "</h2>" + field("What you see", p.w) + field("How it works", p.h) + field("How it feels", p.f) +
    field("Family", (D.groups.find(g => g.id === p.g) || {}).name) + field("Where it's from", p.e) + field("Source", p.s);
}
function showIdea(d, i){
  document.querySelectorAll("#spread li").forEach(li => li.setAttribute("aria-current", li.dataset.i == i));
  $("#detail").innerHTML = '<span class="band ' + bandClass(d.verdict) + '">' + esc(d.verdict) + '</span><h2>' + (i+1) + ". " + esc(d.name) + "</h2>" +
    field("What you see", d.what) + field("How it works", d.how) + field("How it feels", d.feel) +
    (d.nearest && d.nearest.length ? '<button id="near">Show what it\'s closest to</button><div id="nearbox" hidden>' +
      field("Closest thing that exists", d.nearest.join("; ")) + field("Critic's view", d.reason) +
      field("Borrows from", (d.borrows || []).join("; ")) + "</div>" : "");
  // what already exists stays hidden until asked for, so it doesn't steer how the viewer sees the idea
  const b = $("#near");
  if (b) b.onclick = () => { $("#nearbox").hidden = false; b.remove(); };
}
</script>
</body>
</html>
